# The real backend (repo / branch / OAuth proxy) is injected at runtime by
# index.html from public/deploy.config.js — edit that file, not this block.
# These placeholders only keep config.yml valid for parsing / local_backend.
backend:
  name: github
  repo: hiiampadik/AtlasOfClimateChange
  branch: master

local_backend: true

media_folder: "public/images/atlas"
public_folder: "/images/atlas"

collections:
  - name: "infographics"
    label: "Infographics"
    label_singular: "Infographic"
    folder: "src/content/infographics"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}  ·  {{chapter}}"
    sortable_fields: ["order", "chapter", "title"]
    view_groups:
      - label: "Chapter"
        field: "chapter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Lead", name: "lead", widget: "text", hint: "Short intro shown in the feed and above the chart." }
      - label: "Chapter"
        name: "chapter"
        widget: "select"
        options:
          - { label: "Introduction", value: "introduction" }
          - { label: "The Science", value: "the-science" }
          - { label: "The Impacts", value: "the-impacts" }
          - { label: "The Trajectory", value: "the-trajectory" }
          - { label: "The Solutions", value: "the-solutions" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1, hint: "Position within the chapter." }
      - label: "Graphic"
        name: "image"
        widget: "image"
        hint: "The infographic image shown at the top of the page."
      - label: "Downloads"
        name: "downloads"
        widget: "list"
        required: false
        hint: "Downloadable files (PNG, PDF, any format). The button label is taken from the file extension automatically. Add a PNG here if you want one offered — it's no longer generated from the graphic above."
        field: { label: "File", name: "file", widget: "file" }
      - label: "Underlying data"
        name: "data"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Data table URL", name: "tableUrl", widget: "string", required: false }
          - label: "Data sources"
            name: "sources"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            hint: "One entry per source, exactly as printed at the bottom right of the infographic (\"data source: ...\"). Each is shown on its own line in the sidebar; leave the URL empty to print the name without a link."
            fields:
              - { label: "Name", name: "label", widget: "string", hint: "e.g. NASA GISTEMP v4" }
              - { label: "URL", name: "url", widget: "string", required: false }
      - label: "Related infographics"
        name: "related"
        widget: "list"
        required: false
        summary: "{{fields.slug}}"
        hint: "Shown in the \"More articles\" box on this infographic's detail page. Leave empty to automatically show the next 2 infographics."
        field:
          label: "Infographic"
          name: "slug"
          widget: "relation"
          collection: "infographics"
          search_fields: ["title"]
          value_field: "{{slug}}"
          display_fields: ["title"]
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page"
        file: "src/content/about/about.md"
        description: "Content shown on the About page."
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Meta description", name: "description", widget: "text", required: false, hint: "Shown in search results and social previews. Falls back to the site default (Settings → SEO) if left blank." }
          - { label: "Body", name: "body", widget: "markdown" }

  # NOTE: the "Get the Atlas in your language" collection is NOT defined here —
  # it's appended at runtime by index.html only on the English fork
  # (deploy.config.js `lang: 'en'`). Other forks link the footer straight to the
  # external "language versions" URL instead.

  - name: "settings"
    label: "Settings"
    files:
      - name: "navigation"
        label: "Navigation, Languages & Footer"
        file: "src/data/site.json"
        description: "External links (About page sidebar), language switcher, and footer content."
        fields:
          - label: "External links"
            name: "menuLinks"
            label_singular: "External link"
            widget: "list"
            hint: "Shown in the \"External links\" box on the About page's sidebar."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Language versions"
            name: "languages"
            label_singular: "Language"
            widget: "list"
            summary: "{{fields.code}}"
            fields:
              - { label: "Code", name: "code", widget: "string", hint: "Shown in the switcher, e.g. EN" }
              - { label: "Flag emoji", name: "flag", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string", hint: "Link to that language's site" }
              - { label: "hreflang code", name: "hreflang", widget: "string", required: false, hint: "ISO language code for SEO, e.g. en, cs, pt-BR. Leave blank to exclude this version from hreflang tags." }
          - label: "Social links"
            name: "socialLinks"
            label_singular: "Social link"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Shown as icon links in the footer."
            fields:
              - { label: "Name", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - label: "Icon (SVG)"
                name: "icon"
                widget: "image"
                media_folder: "/public/images/social"
                public_folder: "/images/social"
          - label: "Atlas PDF"
            name: "atlasPdfUrl"
            widget: "file"
            required: false
            hint: "Shown as a \"Download PDF\" button in the footer, next to the Atlas title."
          - label: "Get the Atlas in your language — URL"
            name: "languageVersionsUrl"
            widget: "string"
            required: false
            hint: "Shown as a link below the language switcher in the footer."
          - label: "Footer legal text"
            name: "footerLegal"
            widget: "markdown"
            minimal: true
            buttons: ["bold", "italic", "link"]
            editor_components: []
            hint: "Copyright, license, and contact info — shown as a single paragraph in the footer. Add links with the link button; bare emails/URLs become clickable automatically."

      - name: "seo"
        label: "SEO"
        file: "src/data/seo.json"
        description: "Site title, default meta description, and social share image used across every page."
        fields:
          - { label: "Site title", name: "siteTitle", widget: "string", hint: "Used in every page's <title>, and as the site name in social share previews." }
          - { label: "Default meta description", name: "defaultDescription", widget: "text", hint: "Used on the homepage and 404 page, and as a fallback anywhere else with no description of its own." }
          - label: "Default social share image"
            name: "ogImageFallback"
            widget: "image"
            hint: "1200×630px. Used for pages without their own image (homepage, About, 404)."

      - name: "chapters"
        label: "Chapters"
        file: "src/data/chapters.json"
        description: "Section titles and taglines shown in the feed. Translate the name and tagline; keep the ID unchanged."
        fields:
          - label: "Chapters"
            name: "chapters"
            label_singular: "Chapter"
            widget: "list"
            summary: "{{fields.name}}  ·  {{fields.tagline}}"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Join key with infographics — keep stable, do not translate." }
              - { label: "Name", name: "name", widget: "string", hint: "Bold section name, e.g. Introduction." }
              - { label: "Tagline", name: "tagline", widget: "string", hint: "Descriptive tagline, e.g. The Big Picture." }
              - { label: "Subheading", name: "subheading", widget: "text", required: false, hint: "Optional descriptive paragraph shown under the tagline on the homepage." }
              - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1 }
